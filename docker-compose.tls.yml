# 启用 HTTPS：
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# 证书放在 TLS_CERT_DIR 指向的目录里（默认 ./certs）：fullchain.pem 和 privkey.pem。
# HTTP 端口只做 301 跳转；前端的 WebSocket 会跟随页面协议自动使用 wss。

services:
  web:
    ports:
      - "${WEB_TLS_PORT:-443}:8443"
    volumes:
      - ./web/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro

  backend:
    environment:
      # refresh token 的 Cookie 只在 HTTPS 下发送
      COOKIE_SECURE: "true"
