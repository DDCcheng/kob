spring.application.name=backend
server.port=3000
# 自动读取 .env；系统环境变量优先级更高
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.username=${DB_USERNAME:kob}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/kob?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}

kob.matching-system.url=${MATCHING_SYSTEM_URL:http://127.0.0.1:3001}
kob.bot-running-system.url=${BOT_RUNNING_SYSTEM_URL:http://127.0.0.1:3002}
kob.internal.allowed-ip=${INTERNAL_ALLOWED_IP:127.0.0.1}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

# 允许跨域访问的前端地址，多个用逗号分隔
kob.web.origins=${WEB_ORIGINS:http://localhost:8080}
# refresh token 的 Cookie 是否只在 HTTPS 下发送，线上应设为 true
kob.cookie.secure=${COOKIE_SECURE:false}

# 收到停止信号后先处理完在途请求再退出
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# 提供 /actuator/health/liveness 和 /actuator/health/readiness
management.endpoint.health.probes.enabled=true

# refresh token 的 Cookie 路径；经反向代理加了 /api 前缀时要改成 /api/user/account/
kob.cookie.path=${COOKIE_PATH:/user/account/}
