# HTTP 和 HTTPS 两个入口共用的配置

server_tokens off;
client_max_body_size 256k;

# 用 Docker 内置 DNS 动态解析后端地址，后端容器重启换了 IP 也能跟上
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:3000;

# 注意：下面的 location 里都不能再写 add_header，否则这里的安全响应头会被整体覆盖
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'" always;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# ---------- 接口 ----------

# 服务之间互相调用的内部接口和监控端点，不对外
location ^~ /api/pk/ { return 404; }
location ^~ /api/actuator { return 404; }

# 登录、注册、刷新等接口，限流
location ^~ /api/user/account/ {
    limit_req zone=auth burst=20 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    include /etc/nginx/kob/proxy.conf;
}

location ^~ /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    include /etc/nginx/kob/proxy.conf;
}

location ^~ /websocket/ {
    proxy_pass $backend;
    include /etc/nginx/kob/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 对局期间连接可能长时间没有消息
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# ---------- 静态资源 ----------

root /usr/share/nginx/html;

# 文件名带内容哈希，可以长期缓存
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# 单页应用：其余路径都交给 index.html，由前端路由处理；index.html 本身不缓存
location / {
    expires -1;
    try_files $uri /index.html;
}
